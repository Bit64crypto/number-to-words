<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Crypbit Number-to-Words Pad</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Roboto:wght@400;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg1: #0a0a0a;
      --bg2: #141414;
      --card-bg: rgba(30,30,30,0.7);
      --text: #e0e0e0;
      --accent: #00e5ff;
      --radius: 14px;
      --shadow: 0 6px 40px rgba(0, 0, 0, 0.8);
    }
    *, *::before, *::after { margin:0; padding:0; box-sizing: border-box; }
    body {
      position: relative;
      height:100vh;
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      background: linear-gradient(120deg, var(--bg1), var(--bg2));
      background-size: 200% 200%;
      animation: bgAnim 12s ease infinite;
      font-family: 'Roboto', sans-serif;
      color: var(--text);
      overflow:hidden;
    }
    @keyframes bgAnim {
      0% { background-position: 0% 0%; }
      50% { background-position: 100% 100%; }
      100% { background-position: 0% 0%; }
    }
    .blob {
      position:absolute;
      width:350px;
      height:350px;
      top:40%; left:50%;
      background: radial-gradient(circle at 30% 30%, rgba(0,229,255,0.3), transparent 60%);
      filter: blur(120px);
      transform: translate(-50%, -50%);
      animation: blobMove 10s ease-in-out infinite;
      z-index:0;
    }
    @keyframes blobMove {
      0%,100% { transform: translate(-50%, -50%) scale(1); }
      50% { transform: translate(-40%, -45%) scale(1.3); }
    }
    .title {
      position: relative;
      z-index:1;
      font-family: 'Orbitron', sans-serif;
      font-size: 3rem;
      color: var(--accent);
      text-shadow: 0 0 8px var(--accent), 0 0 16px var(--accent);
      margin-bottom: 24px;
      animation: neonFlicker 3s infinite;
    }
    @keyframes neonFlicker {
      0%, 18%, 22%, 25%, 53%, 57%, 100% { text-shadow: 0 0 8px var(--accent), 0 0 16px var(--accent); }
      20%, 24%, 55% { text-shadow: none; }
    }
    .calculator {
      position: relative;
      z-index:1;
      background: var(--card-bg);
      border: 2px solid rgba(0,229,255,0.4);
      border-radius: var(--radius);
      box-shadow: var(--shadow), 0 0 30px rgba(0,229,255,0.4);
      padding: 32px;
      width: 360px;
      backdrop-filter: blur(8px);
      transition: transform 0.4s;
    }
    .calculator:hover { transform: scale(1.05) rotate(-0.5deg); }
    .display, .words {
      width:100%;
      min-height:3.2em;
      margin-bottom:20px;
      padding:16px;
      border-radius: var(--radius);
      background: rgba(43,43,43,0.85);
      color: var(--text);
      font-family: 'Orbitron', sans-serif;
      letter-spacing:1px;
      backdrop-filter: blur(4px);
    }
    .display { font-size:1.8em; }
    .words {
      font-size:1.1em;
      color: #d0d0d0;
      font-family: 'Roboto', sans-serif;
      font-style: italic;
      text-shadow: 0 0 4px rgba(0,229,255,0.2);
    }
    .keys {
      display:grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 14px;
    }
    .keys button {
      position: relative;
      overflow: hidden;
      padding:20px 0;
      font-size:1.4em;
      font-family: 'Orbitron', sans-serif;
      background: rgba(46,46,46,0.9);
      color: var(--text);
      border:none;
      border-radius: var(--radius);
      box-shadow: inset 0 -5px 0 rgba(0,0,0,0.3), var(--shadow);
      cursor:pointer;
      transition: background 0.3s, transform 0.15s, box-shadow 0.15s;
    }
    .keys button:hover {
      background: rgba(46,46,46,1);
      box-shadow: 0 0 16px var(--accent), inset 0 -3px 0 rgba(0,0,0,0.3);
      transform: translateY(-2px);
    }
    .keys button:active {
      background: rgba(30,30,30,1);
      transform: scale(0.95);
      box-shadow: inset 0 6px 12px rgba(0,0,0,0.6);
    }
    .keys .wide { grid-column: span 2; }
  </style>
</head>
<body>
  <div class="blob"></div>
  <h1 class="title">Crypbit</h1>
  <div class="calculator">
    <div id="display" class="display"></div>
    <div id="words" class="words"></div>
    <div class="keys">
      <button data-num="1">1</button>
      <button data-num="2">2</button>
      <button data-num="3">3</button>
      <button data-num="4">4</button>
      <button data-num="5">5</button>
      <button data-num="6">6</button>
      <button data-num="7">7</button>
      <button data-num="8">8</button>
      <button data-num="9">9</button>
      <button data-num="clear" class="wide">C</button>
      <button data-num="0">0</button>
      <button data-num="back">←</button>
    </div>
  </div>
  <script>
    function formatWithCommas(str) {
      return str.replace(/\B?(?=(\d{3})+(?!\d))/g, ',');
    }
    function numberToWords(num) {
      if (num === 0) return 'zero';
      const ones=['','one','two','three','four','five','six','seven','eight','nine'];
      const teens=['ten','eleven','twelve','thirteen','fourteen','fifteen','sixteen','seventeen','eighteen','nineteen'];
      const tens=['','','twenty','thirty','forty','fifty','sixty','seventy','eighty','ninety'];
      const scales=['','thousand','million','billion'];
      let words=''; let scale=0;
      while(num>0){let chunk=num%1000; if(chunk){let w='';const h=Math.floor(chunk/100),r=chunk%100; if(h)w+=ones[h]+' hundred'; if(r){ if(w)w+=' '; if(r<10)w+=ones[r]; else if(r<20)w+=teens[r-10]; else{w+=tens[Math.floor(r/10)]; if(r%10)w+='-'+ones[r%10];}} words=w+(scales[scale]? ' '+scales[scale]:'')+(words?' '+words:'');} num=Math.floor(num/1000); scale++;} return words;}
    let raw=''; const displayEl=document.getElementById('display'), wordsEl=document.getElementById('words');
    document.querySelector('.keys').addEventListener('click',e=>{ if(!e.target.matches('button'))return; const key=e.target.dataset.num; if(key==='clear')raw=''; else if(key==='back')raw=raw.slice(0,-1); else raw+=key; displayEl.textContent=raw?formatWithCommas(raw):''; wordsEl.textContent=raw?numberToWords(parseInt(raw,10)):' '; });
  </script>
</body>
</html>
