<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Number-to-Words Pad</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Roboto:wght@400;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #121212;
      --card-bg: #1e1e1e;
      --display-bg: #2b2b2b;
      --text-color: #e0e0e0;
      --accent: #009eff;
      --button-bg: #2e2e2e;
      --button-hover: #3a3a3a;
      --button-active: #444;
      --radius: 10px;
      --shadow: 0 4px 20px rgba(0,0,0,0.5);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--bg);
      background: radial-gradient(circle at top left, #181818, #0f0f0f);
      font-family: 'Roboto', sans-serif;
    }
    .calculator {
      background: var(--card-bg);
      border-radius: var(--radius);
      box-shadow: var(--shadow), 0 0 20px rgba(0,158,255,0.3);
      padding: 20px;
      width: 300px;
      transition: transform 0.2s;
    }
    .calculator:hover { transform: scale(1.02); }
    .display, .words {
      width: 100%;
      min-height: 2.5em;
      margin-bottom: 15px;
      padding: 12px;
      border-radius: var(--radius);
      background: var(--display-bg);
      color: var(--text-color);
      font-family: 'Orbitron', sans-serif;
      letter-spacing: 1px;
    }
    .display { font-size: 1.5em; }
    .words {
      font-size: 1em;
      color: #aaa;
      font-family: 'Roboto', sans-serif;
    }
    .keys {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
    }
    .keys button {
      position: relative;
      padding: 16px 0;
      font-size: 1.2em;
      font-family: 'Orbitron', sans-serif;
      color: var(--text-color);
      background: var(--button-bg);
      border: none;
      border-radius: var(--radius);
      box-shadow: inset 0 -4px 0 rgba(0,0,0,0.2), var(--shadow);
      cursor: pointer;
      transition: background 0.2s, transform 0.1s, box-shadow 0.1s;
    }
    .keys button:hover { background: var(--button-hover); }
    .keys button:active {
      background: var(--button-active);
      transform: scale(0.98);
      box-shadow: inset 0 4px 8px rgba(0,0,0,0.4);
    }
    .keys .wide { grid-column: span 2; }
  </style>
</head>
<body>
  <div class="calculator">
    <div id="display" class="display"></div>
    <div id="words" class="words"></div>
    <div class="keys">
      <button data-num="1">1</button>
      <button data-num="2">2</button>
      <button data-num="3">3</button>
      <button data-num="4">4</button>
      <button data-num="5">5</button>
      <button data-num="6">6</button>
      <button data-num="7">7</button>
      <button data-num="8">8</button>
      <button data-num="9">9</button>
      <button data-num="clear" class="wide">C</button>
      <button data-num="0">0</button>
      <button data-num="back">←</button>
    </div>
  </div>

  <script>
    function numberToWords(num) {
      if (num === 0) return 'zero';
      const ones = ['', 'one','two','three','four','five','six','seven','eight','nine'];
      const teens = ['ten','eleven','twelve','thirteen','fourteen','fifteen','sixteen','seventeen','eighteen','nineteen'];
      const tens = ['','','twenty','thirty','forty','fifty','sixty','seventy','eighty','ninety'];
      const scales = ['', 'thousand', 'million', 'billion'];
      let words = '';
      let scaleIdx = 0;
      while (num > 0) {
        let chunk = num % 1000;
        if (chunk) {
          let chunkWords = '';
          const hundred = Math.floor(chunk / 100);
          const rem = chunk % 100;
          if (hundred) {
            chunkWords += ones[hundred] + ' hundred';
          }
          if (rem) {
            if (chunkWords) chunkWords += ' ';
            if (rem < 10)       chunkWords += ones[rem];
            else if (rem < 20)  chunkWords += teens[rem - 10];
            else {
              chunkWords += tens[Math.floor(rem / 10)];
              if (rem % 10) chunkWords += '-' + ones[rem % 10];
            }
          }
          words = chunkWords
                + (scales[scaleIdx] ? ' ' + scales[scaleIdx] : '')
                + (words ? ' ' + words : '');
        }
        num = Math.floor(num / 1000);
        scaleIdx++;
      }
      return words;
    }

    const displayEl = document.getElementById('display');
    const wordsEl = document.getElementById('words');

    document.querySelector('.keys').addEventListener('click', e => {
      if (!e.target.matches('button')) return;
      const key = e.target.dataset.num;
      if (key === 'clear') {
        displayEl.textContent = '';
        wordsEl.textContent = '';
        return;
      }
      if (key === 'back') {
        displayEl.textContent = displayEl.textContent.slice(0, -1);
      } else {
        displayEl.textContent += key;
      }
      const text = displayEl.textContent;
      if (!text) {
        wordsEl.textContent = '';
      } else {
        const n = parseInt(text, 10);
        wordsEl.textContent = isNaN(n) ? '' : numberToWords(n);
      }
    });
  </script>
</body>
</html>
